<section id="contact">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Contact Us</h2>
                    <h3 class="section-subheading text-muted">How can we help?</h3>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <form name="sentMessage" id="contactForm" novalidate>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="control-group form-group">
                                    <input type="text" class="form-control" placeholder="Your Name *" id="name" name="name" required 
                                        data-validation-required-message="Please enter your name." 
                                        minlength="2" data-validation-minlength-message="Name must be at least 2 characters">
                                    <p class="help-block text-danger"></p>
                                </div>
                                <div class="control-group form-group">
                                    <input type="email" class="form-control" placeholder="Your Email *" id="email" name="email" required 
                                        data-validation-required-message="Please enter your email address."
                                        pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" 
                                        data-validation-pattern-message="Please enter a valid email address">
                                    <p class="help-block text-danger"></p>
                                </div>
                                <div class="control-group form-group">
                                    <input type="tel" class="form-control" placeholder="Your Phone *" id="phone" name="phone" required 
                                        data-validation-required-message="Please enter your phone number."
                                        pattern="^[0-9\-\+\s\(\)\.]{6,20}$" 
                                        data-validation-pattern-message="Please enter a valid phone number">
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="control-group form-group">
                                    <textarea class="form-control" placeholder="Your Message *" id="message" name="message" required 
                                        data-validation-required-message="Please enter a message."
                                        minlength="10" data-validation-minlength-message="Your message must be at least 10 characters"></textarea>
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <!-- Honeypot field to prevent spam -->
                            <div style="display:none">
                                <input type="text" name="_gotcha" id="_gotcha">
                            </div>
                            <div class="clearfix"></div>
                            <div class="col-lg-12 text-center">
                                <div id="success"></div>
                                <button type="submit" class="btn btn-xl">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
